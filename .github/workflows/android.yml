name: Build SomeoneGPT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q SomeoneGPT-Android-GitHub.zip
      - name: Fix JVM target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("SomeoneGPT-Android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }""",
              1
          )
          p.write_text(s)
          PY
      - name: Build APK
        run: gradle -p SomeoneGPT-Android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SomeoneGPT-APK
          path: SomeoneGPT-Android/app/build/outputs/apk/debug/app-debug.apk
